<!doctype html>
<!--
  MCP Here's demo, drawn as a scene: render(t) paints the exact frame for time t (seconds), so
  render.mjs steps through it frame by frame and the video comes out the same every time. Open the
  file in a browser to watch it loop. Add ?narrow for the tighter cut the landing page shows on phones.

  The corner bar is the extension's own markup and CSS (src/ui/styles.ts, src/ui/icons.ts), drawn at
  the page's 150% zoom over a screenshot of railway.com. Everything inside #world zooms with the
  camera; the menu bar, the keycaps and the end card stay put.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP Here demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: #0f172a;
         -webkit-font-smoothing: antialiased; position: relative; background: #e9eef5; }
  .abs { position: absolute; }
  #world { inset: 0; transform-origin: 0 0;
           background: radial-gradient(1400px 900px at 15% 0%, #f1f5f9 0%, transparent 60%),

  #menubar { z-index: 2; left: 0; top: 0; width: 1920px; height: 34px; background: rgba(255,255,255,.6); backdrop-filter: blur(20px);
             display: flex; align-items: center; padding: 0 22px; font-size: 14px; gap: 26px; }
  #menubar .right { margin-left: auto; }

  /* Chrome, light theme. The page area starts at (40, 148) and is 1840×911 screen px. */
  .browser { left: 40px; top: 58px; width: 1840px; height: 1001px; border-radius: 12px; overflow: hidden; background: #fff;
             box-shadow: 0 30px 80px rgba(15,23,42,.22), 0 0 0 1px rgba(15,23,42,.12); }
  .tabs { height: 42px; background: #dfe3e8; display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
  .lights { display: flex; gap: 8px; align-self: center; margin: 0 18px 0 6px; }
  .lights span { width: 13px; height: 13px; border-radius: 50%; }
  .ctab { height: 34px; width: 250px; background: #fff; border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; }
  .ctab .fav { width: 16px; height: 16px; border-radius: 50%; background: #13111c; display: grid; place-items: center; }
  .ctab .fav i { width: 9px; height: 2px; background: #fff; border-radius: 1px; box-shadow: 0 -3px 0 #fff, 0 3px 0 #fff; }
  .ctab .x { margin-left: auto; color: #5f6368; font-size: 15px; }
  .toolbar { height: 48px; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid #e3e6ea; color: #5f6368; font-size: 18px; }
  .omni { flex: 1; height: 34px; border-radius: 17px; background: #eef1f4; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; color: #202124; }
  .omni .lock { width: 13px; height: 13px; color: #5f6368; }
  .ext { width: 22px; height: 22px; border-radius: 5px; }
  .page { left: 0; top: 90px; width: 1840px; height: 911px; }

  /* The extension's UI, at the page's zoom. Positioned like its fixed .wrap, inside the page area. */
  #page-ui { left: 40px; top: 148px; width: 1227px; height: 607px; transform: scale(1.5); transform-origin: 0 0; }
  #mh { position: absolute; right: 20px; bottom: 20px; }

  /* Terminal, for the payoff. */
  #term { left: 250px; top: 330px; width: 1100px; height: 290px; border-radius: 12px; overflow: hidden; background: #16181d;
          box-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08); }
  #term .tbar { height: 40px; background: #23262d; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  #term .tbar b { flex: 1; text-align: center; font: 500 14px -apple-system, sans-serif; color: #9aa0a8; margin-right: 60px; }
  #term pre { padding: 22px 26px; font: 21px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #e6e6e6; white-space: pre-wrap; word-break: break-all; }
  #term pre * { font: inherit; }
  #term .p { color: #22c55e; }
  #term .dim { color: #8b929c; }
  .tcaret { display: inline-block; width: 11px; height: 24px; background: #e6e6e6; vertical-align: -5px; }

  #pointer { width: 28px; height: 40px; transform-origin: 3px 2px; z-index: 5; }
  #ripple { width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid rgba(34,197,94,.8); z-index: 5; }

  .key { min-width: 64px; height: 64px; padding: 0 14px; border-radius: 13px; background: rgba(17,24,39,.88); color: #fff; font-size: 28px;

  #end { z-index: 4; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  #end img { width: 112px; height: 112px; border-radius: 26px; }
  #end h2 { font: 700 104px/1.05 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -3px; text-align: center; }

  #end .cta { margin-top: 8px; display: flex; align-items: center; gap: 16px; background: #111827; color: #fff; font-size: 32px; font-weight: 600;

  #end .cta img { width: 36px; height: 36px; border-radius: 0; }
</style>

.menu {

.pick {

.pick-by { color: #6b7280; font-weight: 400; }
.dot.amber { background: #f59e0b; box-shadow: 0 0 0 3px rgb(245 158 11 / 0.2); }
.split .main > svg { width: 16px; height: 16px; }
.tab {

}

.tab .dot { position: absolute; top: 6px; right: 6px; }

.apps { display: flex; flex-direction: column; gap: 1px; }
.app {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: 9px; font-size: 13px; color: inherit;
}
.app:hover, .app:focus-visible { background: var(--mh-hover); }
.app.selected { background: var(--mh-hover); }
.app-icon { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
.app-icon svg { width: 18px; height: 18px; }
.app-name { flex: 1; }
.app-note { color: var(--mh-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.app-kind { color: var(--mh-muted); display: flex; }

.app.more > svg { width: 14px; height: 14px; margin: 0 2px; }
.divider { height: 1px; background: var(--mh-border); margin: 4px 6px; }

.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.tag.official { background: #dcfce7; color: #166534; }
.tag.setup { background: #dbeafe; color: #1e40af; }
.tag.unofficial { background: #fef3c7; color: #92400e; }
.note { margin: 2px 6px 6px; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.4; background: #fffbeb; color: #92400e; }
.note.setup { background: #eff6ff; color: #1e40af; }
.note button { all: unset; cursor: pointer; text-decoration: underline; }

.toast {
  display: flex; align-items: center; gap: 10px; box-sizing: border-box;
  background: #111827; color: #fff; border-radius: 14px; padding: 10px 12px; font-size: 13px;

.toast-body { min-width: 0; }

<template id="v-toast">
  <div class="toast">
    <span class="toast-check"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span>
    <div class="toast-body"><div class="toast-title">Copied. Paste it in your terminal.</div><code class="toast-code">claude mcp add --scope user --transport http railway https://mcp.railway.com/</code></div>
  </div>
</template>

<script>
const W = 1920, H = 1080;
const DURATION = 13.5;
const NARROW = location.search.includes('narrow');

// Screen coordinates of what the pointer touches, measured from the drawn UI (node stills.mjs prints them with ?measure).
const AT = {
  caret: [1767, 992],
  rows: { top: 578, height: 52.8, x: 1560 },   // Claude Code's row; each next row is `height` lower
  term: [820, 540],
};
const COMMAND = 'claude mcp add --scope user --transport http railway https://mcp.railway.com/';

// The timeline, in seconds and screen coordinates.
const BAR_IN = 1.4;
const MENU = 3.55, PICK = 6.0;
const TERM_IN = 7.2, PASTE = 8.4, ENTER = 9.4, OUTPUT = 9.75;
const END = 11.6;
const row = (i) => AT.rows.top + AT.rows.height * i;
const CURSOR = [
  [0, 900, 700], [0.9, 1010, 640], [1.7, 1010, 640],    // browsing railway.com
  [2.9, ...AT.caret], [3.6, ...AT.caret],                // the caret
  [4.3, AT.rows.x, row(1)], [4.7, AT.rows.x, row(2)],    // looking down the list
  [5.1, AT.rows.x, row(2)], [5.8, AT.rows.x, row(0)], [6.4, AT.rows.x, row(0)],  // Claude Code
  [7.6, ...AT.term], [DURATION, ...AT.term],             // into the terminal
];
const CLICKS = [MENU, PICK, 7.75];
const KEYS = [{ t: PASTE - 0.15, keys: ['⌘', 'V'] }, { t: ENTER - 0.15, keys: ['return ↩'] }];
// The camera [t, zoom, focus x, focus y]: in ~0.6 s before each action, hold through it, out between scenes.
const CAMERA = NARROW ? [
  [0, 1, 960, 540], [1.3, 1, 960, 540],
  [2.2, 2.3, 1500, 1000], [3.7, 2.3, 1500, 1000],
  [4.2, 2.3, 1520, 705], [6.0, 2.3, 1520, 705],
  [6.5, 2.3, 1500, 1000], [7.0, 2.3, 1500, 1000],   // the toast
  [7.6, 1, 960, 540],
  [8.2, 1.75, 800, 475], [11.2, 1.75, 800, 475],
] : [
  [0, 1, 960, 540], [1.4, 1, 960, 540],
  [2.2, 1.7, 1500, 900], [6.4, 1.7, 1500, 900],
  [7.0, 1, 960, 540], [7.6, 1, 960, 540],
  [8.2, 1.5, 800, 475], [11.2, 1.5, 800, 475],
];

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const pulse = (t, a, b, fade = 0.15) => Math.min(seg(t, a, a + fade), 1 - seg(t, b - fade, b));

function track(keys, t) {
  let i = 0;
  while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const x = a === b ? 0 : ease(seg(t, a[0], b[0]));
  return a.slice(1).map((v, j) => lerp(v, b[j + 1], x));
}

const tpl = (id) => $(id).innerHTML;
let shown = '';  // cache: which view #mh holds, so it is only rebuilt when the view changes
function setView(view) {
  if (view === shown) return;
  shown = view;
  $('mh').innerHTML = view === 'toast' ? tpl('v-toast') : view === 'menu' ? tpl('v-menu') + tpl('v-bar') : view === 'bar' ? tpl('v-bar') : '';
}

function render(t) {
  const [s, fx, fy] = track(CAMERA, t);
  const tx = clamp(W / 2 - fx * s, W - W * s, 0), ty = clamp(H / 2 - fy * s, H - H * s, 0);
  $('world').style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;

  const [cx, cy] = track(CURSOR, t);
  const click = CLICKS.find((c) => t >= c && t < c + 0.45);
  const pointer = $('pointer');
  pointer.style.left = (cx - 3) + 'px'; pointer.style.top = (cy - 2) + 'px';
  pointer.style.transform = click !== undefined && t < click + 0.12 ? 'scale(.85)' : 'none';
  const ripple = $('ripple');
  if (click !== undefined) {
    const x = seg(t, click, click + 0.45);
    Object.assign(ripple.style, { display: 'block', left: cx + 'px', top: cy + 'px', opacity: 0.8 * (1 - x), transform: `scale(${0.4 + 1.2 * ease(x)})` });
  } else ripple.style.display = 'none';

  // The corner bar: slides in, opens the menu, then shows the toast.
  setView(t < BAR_IN ? 'none' : t < MENU ? 'bar' : t < PICK + 0.1 ? 'menu' : 'toast');
  const mh = $('mh');
  const fade = t < PICK ? seg(t, BAR_IN, BAR_IN + 0.35) : seg(t, PICK + 0.1, PICK + 0.35);
  mh.style.opacity = fade;
  mh.style.transform = `translateY(${(1 - ease(fade)) * 12}px)`;
  if (shown === 'menu') {
    // Hover follows the pointer; the press shows on the picked row.
    const hover = Math.round((cy - AT.rows.top) / AT.rows.height);
    mh.querySelectorAll('.app[data-row]').forEach((b) => {
      const i = Number(b.dataset.row);
      b.style.background = i === hover && cx > 1200 ? '#f3f4f6' : i === 0 ? '#f3f4f6' : '';
      b.style.transform = i === 0 && t >= PICK && t < PICK + 0.12 ? 'scale(.98)' : '';
    });
    const caret = mh.querySelector('.caret');
    caret.style.background = '#f3f4f6';
  }

  // Terminal: slides up, the command pastes in, then Claude Code's answer.
  const term = $('term');
  const ta = seg(t, TERM_IN, TERM_IN + 0.35);
  term.style.display = ta > 0 ? 'block' : 'none';
  term.style.opacity = ta;
  term.style.transform = `translateY(${(1 - ease(ta)) * 30}px)`;
  const blink = Math.floor(t * 2) % 2 === 0 ? '<span class="tcaret"></span>' : '';
  let tty = '<span class="dim">~</span> <span class="p">❯</span> ' + (t >= PASTE ? COMMAND : '');
  if (t < OUTPUT) tty += blink;
  else tty += '\n' + 'Added HTTP MCP server railway with URL: https://mcp.railway.com/ to user config\n'
    + '<span class="dim">File modified: /Users/you/.claude.json</span>\n<span class="dim">~</span> <span class="p">❯</span> ' + blink;
  if ($('tty').innerHTML !== tty) $('tty').innerHTML = tty;

  const k = KEYS.find((k) => t >= k.t && t < k.t + 0.9);
  const keysEl = $('keys');
  const html = k ? k.keys.map((key) => `<span class="key">${key}</span>`).join('') : '';
  if (keysEl.innerHTML !== html) keysEl.innerHTML = html;
  keysEl.style.opacity = k ? pulse(t, k.t, k.t + 0.9, 0.15) : 0;

  const end = $('end');
  const ea = seg(t, END, END + 0.45);
  end.style.display = ea > 0 ? 'flex' : 'none';
  end.style.opacity = ea;
}

// ?measure: log the screen rects of the controls the pointer touches, to fill in AT.
function measure() {
  const r = (el) => { const b = el.getBoundingClientRect(); return [Math.round(b.left + b.width / 2), Math.round(b.top + b.height / 2), Math.round(b.width), Math.round(b.height)]; };
  render(MENU + 0.5);
  $('world').style.transform = 'none';
  const out = { caret: r($('mh').querySelector('.caret')), rows: [...$('mh').querySelectorAll('.app[data-row]')].map(r) };
  return JSON.stringify(out);
}

window.DURATION = DURATION;
window.render = render;
window.measure = measure;
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); })();
} else render(0);
</script>
