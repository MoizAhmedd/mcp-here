name: Publish index
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      registry_minutes:
        description: Minutes to spend reading the registry (longer for a first full pass)
        default: '120'
  # Site-only changes redeploy without re-crawling.
  push:
    branches: [main]
    paths: ['site/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # The registry budget (2 h unless a manual run changes it) plus ~15 min of crawl.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build index (registry + crawl of the top 10,000 sites)
        if: github.event_name != 'push'
        run: npm run index
        env:
          REGISTRY_MINUTES: ${{ inputs.registry_minutes || '120' }}
      - name: Reuse the published index
        if: github.event_name == 'push'
        run: |
          curl -fsSL https://moizahmedd.github.io/mcp-here/data/index.json -o data/index.json || true
          curl -fsSL https://moizahmedd.github.io/mcp-here/data/registry.json -o data/registry.json || true
      - name: Assemble site
        run: |
          mkdir -p public/data
          cp data/index.json public/data/index.json
          # The registry snapshot the next build starts from (not read by the extension).
          if [ -f data/registry.json ]; then cp data/registry.json public/data/registry.json; fi
          if [ -d site ]; then cp -r site/. public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
