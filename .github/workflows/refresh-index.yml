name: Refresh registry index
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run index
      # Published as a release asset rather than committed, so the repo doesn't grow daily.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view registry-index >/dev/null 2>&1 || gh release create registry-index --title "Registry index" --notes "Daily snapshot of the official MCP registry, grouped by domain. Updated automatically." --latest=false
          gh release upload registry-index data/registry-index.json --clobber
